name: Build CarLife Bridge APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore debug.keystore from debug.keystore.base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Signed Debug APK (Samsung S26 Ultra / Jetta VS7 CarLife)
        run: gradle :app:assembleDebug

      - name: Copy APK to /apk directory
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/CarLifeBridge-debug.apk

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLifeBridge-S26Ultra-APK
          path: apk/CarLifeBridge-debug.apk
          if-no-files-found: error
